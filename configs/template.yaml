# Template for onboarding a new company. Copy this file to
# configs/{company_id}.yaml and fill in at minimum: company.id, company.name.
# Everything else falls back to these defaults via config_loader.py's
# deep-merge — only override what this company actually needs to differ on.

company:
  id: company_xxx
  name: "Company Name"
  description: "Engineering documentation"

sources:
  - type: pdf
    path: ./data/companies/company_xxx/raw_pdfs/
    glob: "*.pdf"

processing:
  chunk_size: 512
  chunk_overlap: 50
  min_chunk_length: 100
  preserve_code_blocks: true

embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 32
  device: cpu

vector_store:
  type: chromadb
  path: ./data/companies/company_xxx/vector_store/
  collection_name: company_xxx_docs
  distance_metric: cosine

retrieval:
  top_k: 10
  rerank_top_k: 5
  use_bm25: true
  use_reranker: true
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
